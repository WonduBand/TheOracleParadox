<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Now Playing · The Oracle Paradox</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<link rel="stylesheet" href="base.css">
<link rel="stylesheet" href="now-playing.css">
<script>
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) document.documentElement.classList.add("reduce");
</script>
</head>
<body>
<p class="concept-label">Concept 1 · Now Playing</p>
<div class="stage">
  <div class="phone" id="phone" data-act="actI">
    <div class="city" aria-hidden="true">
      <div class="city-track">
        <img alt=""><img class="city-flip" alt=""><img alt=""><img class="city-flip" alt="">
      </div>
      <div class="city-shade"></div>
    </div>

    <main class="list">
      <header class="list-head">
        <div class="mark">WONDU</div>
        <h1 id="actTitle">Act I — The Oracle</h1>
        <p class="blurb" id="actBlurb"></p>
      </header>
      <div class="acts" id="acts" role="tablist" aria-label="Acts"></div>
      <div class="tracks" id="tracks"></div>
    </main>

    <section class="sheet" id="sheet" aria-hidden="true">
      <div class="sheet-top">
        <button type="button" class="icon-btn chev" id="closePlayer" aria-label="Back to tracks">
          <svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>
        </button>
        <div class="who">
          <div class="kicker" id="sheetAct">Act I</div>
          <strong id="sheetTitle">—</strong>
        </div>
      </div>
      <div class="art-wrap"><img id="sheetArt" alt=""></div>
      <div class="sheet-foot">
        <h2 id="sheetHeading">—</h2>
        <div class="seek">
          <span id="time">0:00</span>
          <input id="seek" type="range" min="0" max="0" value="0" step="0.1" aria-label="Seek">
          <span id="dur">0:00</span>
        </div>
        <div class="transport">
          <button type="button" class="icon-btn" id="prev" aria-label="Previous track">
            <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
          </button>
          <button type="button" class="play-main" id="play" aria-label="Play or pause">
            <svg id="playIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
          </button>
          <button type="button" class="icon-btn" id="next" aria-label="Next track">
            <svg viewBox="0 0 24 24"><path d="M16 6h2v12h-2zM4.5 18l8.5-6-8.5-6z"/></svg>
          </button>
        </div>
        <button type="button" class="lyrics-open" id="openLyrics">Lyrics</button>
        <p class="hint">Swipe up for lyrics</p>
        <p class="status" id="status" role="status"></p>
      </div>
    </section>

    <section class="lyric-layer" id="lyrics" aria-hidden="true">
      <img class="lyric-bg" id="lyricBg" alt="">
      <div class="lyric-dim"></div>
      <div class="lyric-top">
        <button type="button" class="icon-btn chev" id="closeLyrics" aria-label="Back to artwork">
          <svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>
        </button>
        <div class="who">
          <div class="kicker">Lyrics</div>
          <strong id="lyricTitle">—</strong>
        </div>
      </div>
      <div class="lyric-scroll" id="lyricScroll">
        <div class="lyrics-body" id="lyricBody"></div>
      </div>
    </section>
  </div>
</div>
<audio id="audio" preload="none"></audio>
<script src="../js/data.js"></script>
<script src="engine.js"></script>
<script src="now-playing.js"></script>
</body>
</html>
