<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WONDU — The Oracle Paradox</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#050608;
    --panel:#0c0f14;
    --panel2:#11151c;
    --border:#22262f;
    --gold:#c9a24b;
    --gold-bright:#e8c878;
    --text:#e9ebf1;
    --dim:#8b93a6;
    --dim2:#565d6c;

    --actI:#4fd6ff;
    --actI-dim:#1f5f75;
    --actII:#ff3b4e;
    --actII-dim:#7a1e28;
    --actIII:#c9a2ff;
    --actIII-dim:#5f4a8a;

    --bar-h:84px;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:'Rajdhani',sans-serif;
    overflow-x:hidden;
    position:relative;
  }
  body::before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    background:
      repeating-linear-gradient(to bottom, rgba(255,255,255,0.018) 0px, rgba(255,255,255,0.018) 1px, transparent 1px, transparent 3px),
      radial-gradient(1400px 900px at 50% 0%, rgba(201,162,75,0.05), transparent 60%);
    z-index:9999;
    mix-blend-mode:overlay;
  }
  h1,h2,h3{font-family:'Orbitron',sans-serif; margin:0;}

  /* ============ HUD UTILITIES ============ */
  .hud-frame{ position:relative; }
  .hud-frame::before, .hud-frame::after{
    content:"";
    position:absolute;
    width:18px; height:18px;
    border-color:var(--gold);
    border-style:solid;
    pointer-events:none;
    opacity:0.85;
    z-index:5;
    transition:border-color 0.3s ease;
  }
  .hud-frame::before{ top:8px; left:8px; border-width:2px 0 0 2px; }
  .hud-frame::after{ bottom:8px; right:8px; border-width:0 2px 2px 0; }

  .hud-tag{
    display:flex;
    align-items:center;
    gap:7px;
    font-family:'Orbitron',sans-serif;
    font-size:0.6rem;
    letter-spacing:2.5px;
    text-transform:uppercase;
    color:var(--dim2);
    margin-bottom:10px;
  }
  .hud-tag::before{
    content:"";
    width:5px; height:5px;
    border-radius:50%;
    background:currentColor;
    box-shadow:0 0 6px currentColor;
  }

  .scan-sweep{
    position:absolute;
    left:0; right:0; height:2px;
    background:linear-gradient(90deg, transparent, var(--gold), transparent);
    opacity:0.55;
    z-index:6;
    pointer-events:none;
    animation:scanSweep 4.5s linear infinite;
  }
  @keyframes scanSweep{
    0%{ top:0%; opacity:0; }
    8%{ opacity:0.55; }
    92%{ opacity:0.55; }
    100%{ top:100%; opacity:0; }
  }

  @keyframes glitchFlicker{
    0%,100%{ transform:translate(0,0); }
    20%{ transform:translate(-1.5px,1px); }
    40%{ transform:translate(1.5px,-1px); }
    60%{ transform:translate(-1px,0); }
    80%{ transform:translate(1px,0); }
  }
  .glitch-hover:hover{ animation:glitchFlicker 0.22s steps(2) 1; }

  #player[data-accent="actI"] .hud-frame::before,
  #player[data-accent="actI"] .hud-frame::after{ border-color:var(--actI); }
  #player[data-accent="actI"] .scan-sweep{ background:linear-gradient(90deg, transparent, var(--actI), transparent); }
  #player[data-accent="actI"] .hud-tag{ color:var(--actI); }

  #player[data-accent="actII"] .hud-frame::before,
  #player[data-accent="actII"] .hud-frame::after{ border-color:var(--actII); }
  #player[data-accent="actII"] .scan-sweep{ background:linear-gradient(90deg, transparent, var(--actII), transparent); }
  #player[data-accent="actII"] .hud-tag{ color:var(--actII); }

  #player[data-accent="actIII"] .hud-frame::before,
  #player[data-accent="actIII"] .hud-frame::after{ border-color:var(--actIII); }
  #player[data-accent="actIII"] .scan-sweep{ background:linear-gradient(90deg, transparent, var(--actIII), transparent); }
  #player[data-accent="actIII"] .hud-tag{ color:var(--actIII); }


  body.has-player{ /* padding-bottom is set dynamically in JS to match the actual bar height */ }

  /* ============ HOME VIEW ============ */
  #home{
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:70px 20px 60px;
    overflow-x:hidden;
    width:100%;
    box-sizing:border-box;
  }
  @media (min-width:901px){
    #home{
      justify-content:center;
      padding-top:40px;
      padding-bottom:40px;
    }
  }
  .logo-wrap{
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .logo-wrap::before{
    content:"";
    position:absolute;
    width:640px; height:640px;
    max-width:150vw;
    border-radius:50%;
    background:
      repeating-radial-gradient(circle at center,
        rgba(201,162,75,0.10) 0px, rgba(201,162,75,0.10) 1px,
        transparent 1px, transparent 46px);
    mask-image:radial-gradient(circle at center, black 0%, transparent 68%);
    -webkit-mask-image:radial-gradient(circle at center, black 0%, transparent 68%);
    pointer-events:none;
    z-index:0;
    animation:ringDrift 40s linear infinite;
  }
  @keyframes ringDrift{
    0%{ transform:rotate(0deg); }
    100%{ transform:rotate(360deg); }
  }
  .logo{
    position:relative;
    z-index:1;
    font-family:'Orbitron',sans-serif;
    font-weight:900;
    font-size:4.4rem;
    letter-spacing:14px;
    text-align:center;
    color:#f4f0e6;
    text-shadow:
      0 0 8px rgba(201,162,75,0.55),
      0 0 30px rgba(201,162,75,0.25);
  }
  .tagline{
    text-align:center;
    color:var(--gold);
    font-family:'Orbitron',sans-serif;
    font-size:0.85rem;
    letter-spacing:6px;
    text-transform:uppercase;
    margin-top:14px;
  }
  .trilogy-sub{
    text-align:center;
    color:var(--dim);
    font-size:1.05rem;
    letter-spacing:1px;
    margin-top:8px;
    font-style:italic;
    font-family:Georgia,serif;
  }
  .hint{
    margin-top:6px;
    color:var(--dim2);
    font-size:0.8rem;
    letter-spacing:2px;
    text-transform:uppercase;
    font-family:'Orbitron',sans-serif;
  }

  .covers{
    margin-top:64px;
    display:grid;
    grid-template-columns:repeat(3, minmax(330px, 460px));
    gap:46px;
    max-width:1560px;
    width:100%;
    justify-content:center;
  }
  .cover-card{
    position:relative;
    cursor:pointer;
    border-radius:6px;
    overflow:hidden;
    border:1px solid var(--border);
    background:var(--panel);
    transition:transform 0.35s ease, box-shadow 0.35s ease, border-color 0.35s ease;
  }
  .cover-card img{
    width:100%;
    display:block;
    aspect-ratio:1/1;
    object-fit:cover;
    filter:saturate(0.92) brightness(0.92);
    transition:filter 0.35s ease, transform 0.6s ease;
  }
  .cover-card:hover img{ filter:saturate(1.1) brightness(1.05); transform:scale(1.035); }
  .cover-card:hover{ transform:translateY(-6px); }
  .cover-card[data-act="actI"]:hover{ box-shadow:0 18px 50px -12px rgba(79,214,255,0.35); border-color:var(--actI-dim); }
  .cover-card[data-act="actII"]:hover{ box-shadow:0 18px 50px -12px rgba(255,59,78,0.35); border-color:var(--actII-dim); }
  .cover-card[data-act="actIII"]:hover{ box-shadow:0 18px 50px -12px rgba(201,162,255,0.35); border-color:var(--actIII-dim); }

  .cover-card .cap{
    padding:14px 16px 16px;
    border-top:1px solid var(--border);
    background:linear-gradient(180deg, var(--panel), var(--panel2));
  }
  .cover-card .cap .actno{
    font-family:'Orbitron',sans-serif;
    font-size:0.68rem;
    letter-spacing:3px;
    color:var(--dim2);
  }
  .cover-card[data-act="actI"] .cap .actno{ color:var(--actI); }
  .cover-card[data-act="actII"] .cap .actno{ color:var(--actII); }
  .cover-card[data-act="actIII"] .cap .actno{ color:var(--actIII); }
  .cover-card .cap .actname{
    font-family:'Orbitron',sans-serif;
    font-size:1.05rem;
    margin-top:4px;
    letter-spacing:1px;
    color:var(--text);
  }
  .cover-card .play-overlay{
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
    background:rgba(5,6,8,0.0);
    opacity:0;
    transition:opacity 0.3s ease, background 0.3s ease;
  }
  .cover-card:hover .play-overlay{ opacity:1; background:rgba(5,6,8,0.28); }
  .play-overlay .ring{
    width:64px; height:64px; border-radius:50%;
    border:1.5px solid rgba(233,235,241,0.85);
    display:flex; align-items:center; justify-content:center;
    backdrop-filter:blur(2px);
  }
  .play-overlay svg{ width:22px; height:22px; margin-left:3px; }

  footer.home-footer{
    margin-top:70px;
    color:var(--dim2);
    font-size:0.72rem;
    letter-spacing:2px;
    text-transform:uppercase;
    font-family:'Orbitron',sans-serif;
    text-align:center;
  }

  /* ============ PLAYER VIEW ============ */
  #player{
    display:none;
    min-height:100vh;
    padding:34px 26px 60px;
    background-repeat:repeat;
    background-size:640px;
    transition:background-image 0.5s ease;
  }
  #player[data-accent="actI"]{
    background-image:linear-gradient(rgba(5,6,8,0.55), rgba(5,6,8,0.55)), url('Background_Album1.jpg');
  }
  #player[data-accent="actII"]{
    background-image:linear-gradient(rgba(5,6,8,0.55), rgba(5,6,8,0.55)), url('Background_Album2.jpg');
  }
  #player[data-accent="actIII"]{
    background-image:linear-gradient(rgba(5,6,8,0.55), rgba(5,6,8,0.55)), url('Background_Album3.jpg');
  }
  .top-bar{
    max-width:1200px;
    margin:0 auto 34px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding-right:56px;
  }
  .back-btn{
    background:transparent;
    border:1px solid var(--border);
    color:var(--dim);
    font-family:'Orbitron',sans-serif;
    font-size:0.72rem;
    letter-spacing:2px;
    text-transform:uppercase;
    padding:9px 16px;
    border-radius:5px;
    cursor:pointer;
    transition:all 0.2s ease;
  }
  .back-btn:hover{ color:var(--gold); border-color:var(--gold); }
  .top-bar .wm{
    font-family:'Orbitron',sans-serif;
    letter-spacing:5px;
    font-size:0.85rem;
    color:var(--dim2);
  }

  /* cover / album header — always centered on top */
  .cover-section{
    max-width:420px;
    margin:0 auto 40px;
    text-align:center;
  }
  .cover-frame{
    width:100%;
    max-width:280px;
    margin:0 auto;
  }
  .cover-section img{
    width:100%;
    border-radius:6px;
    border:1px solid var(--border);
    display:block;
  }
  .cover-section .album-title{
    font-family:'Orbitron',sans-serif;
    font-size:1.5rem;
    margin-top:22px;
    letter-spacing:1px;
    line-height:1.3;
  }
  .cover-section .album-sub{
    margin-top:8px;
    color:var(--dim);
    font-style:italic;
    font-family:Georgia,serif;
    font-size:0.95rem;
  }
  .cover-section .accent-bar{ height:2px; width:56px; margin:16px auto 0; border-radius:2px; }
  .cover-section .meta{
    margin-top:18px;
    font-family:'Orbitron',sans-serif;
    font-size:0.7rem;
    letter-spacing:1.5px;
    color:var(--dim2);
    text-transform:uppercase;
    line-height:2;
  }
  .cover-section .play-album-btn{
    margin-top:18px;
    background:transparent;
    border:1px solid var(--gold);
    color:var(--gold);
    font-family:'Orbitron',sans-serif;
    font-size:0.75rem;
    letter-spacing:2px;
    text-transform:uppercase;
    padding:11px 26px;
    border-radius:5px;
    cursor:pointer;
    transition:background 0.2s ease;
  }
  .cover-section .play-album-btn:hover{ background:rgba(201,162,75,0.1); }

  /* content area: tracklist (+ artwork + lyrics panels once playing) */
  .content-area{
    display:flex;
    justify-content:center;
    align-items:flex-start;
    gap:0px;
    max-width:1460px;
    margin:0 auto;
    transition:gap 0.45s ease;
  }
  .content-area.playing{ gap:32px; }

  .tracklist-col{
    flex:0 0 640px;
    max-width:100%;
    min-width:0;
    transition:flex-basis 0.45s ease;
  }
  .content-area.playing .tracklist-col{ flex:0 0 300px; }

  .tracklist{ display:flex; flex-direction:column; gap:10px; }
  .track{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:8px;
    overflow:hidden;
    position:relative;
    transition:border-color 0.2s ease, background 0.2s ease;
  }
  .track::before{
    content:"";
    position:absolute;
    left:0; top:0; bottom:0;
    width:2px;
    background:var(--gold);
    opacity:0;
    transition:opacity 0.2s ease;
  }
  .track:hover::before{ opacity:0.5; }
  .track.current::before{ opacity:1; }
  .track:hover{ border-color:#3a4150; }
  .track.current{ background:var(--panel2); }
  .track.viewing:not(.current){ border-color:rgba(201,162,75,0.4); }
  .track.viewing:not(.current) .tnum{ color:var(--gold); opacity:0.9; }

  .track-row{
    display:flex;
    align-items:center;
    gap:14px;
    padding:12px 16px;
  }
  .track-playbtn{
    width:30px; height:30px;
    min-width:30px;
    border-radius:50%;
    border:1px solid var(--border);
    background:transparent;
    color:var(--dim);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    font-family:'Orbitron',sans-serif;
    font-size:0.78rem;
    transition:all 0.15s ease;
    position:relative;
  }
  .track-playbtn:hover{ border-color:var(--gold); color:var(--gold); }
  .track-playbtn svg{ width:12px; height:12px; }
  .track-playbtn .eq{ display:none; gap:2px; align-items:flex-end; height:12px; }
  .track-playbtn .eq span{
    width:2px; background:var(--gold); display:inline-block;
    animation:eqbar 0.9s ease-in-out infinite;
  }
  .track-playbtn .eq span:nth-child(1){ animation-delay:0s; }
  .track-playbtn .eq span:nth-child(2){ animation-delay:0.2s; }
  .track-playbtn .eq span:nth-child(3){ animation-delay:0.4s; }
  @keyframes eqbar{ 0%,100%{ height:3px; } 50%{ height:12px; } }
  .track-playbtn .playicon{ display:flex; }
  .track.current .track-playbtn{ border-color:var(--gold); color:var(--gold); }
  .track.current.now-playing .track-playbtn .playicon{ display:none; }
  .track.current.now-playing .track-playbtn .eq{ display:flex; }
  .track.current .track-playbtn .pauseicon{ display:none; }
  .track.current.now-playing:hover .track-playbtn .eq{ display:none; }
  .track.current.now-playing:hover .track-playbtn .pauseicon{ display:flex; }

  .track-title-wrap{ flex:1; min-width:0; }
  .track-title{ font-size:1.05rem; letter-spacing:0.3px; color:var(--text); }
  .tnum{
    display:inline-block;
    font-family:'Orbitron',sans-serif;
    font-size:0.75rem;
    color:var(--dim2);
    letter-spacing:0.5px;
    margin-right:10px;
  }
  .track.current .tnum{ color:var(--gold); opacity:0.75; }
  .track.instrumental .track-title{ color:var(--dim); font-style:italic; }
  .track.current .track-title{ color:var(--gold); }
  .track-tag{
    display:inline-block;
    margin-top:3px;
    font-family:'Orbitron',sans-serif;
    font-size:0.62rem;
    letter-spacing:2px;
    text-transform:uppercase;
    color:var(--dim2);
  }

  /* artwork panel */
  .artwork-col{
    flex:0 0 0px;
    opacity:0;
    overflow:hidden;
    transition:flex-basis 0.45s ease, opacity 0.3s ease;
  }
  .content-area.playing .artwork-col{ flex:0 0 626px; opacity:1; }

  .artwork-panel{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:10px;
    overflow:hidden;
  }
  .artwork-frame{
    width:100%;
    aspect-ratio:1/1;
    background:var(--panel2);
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
  }
  .artwork-frame img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
  }
  .artwork-caption{
    padding:16px 18px 18px;
    border-top:1px solid var(--border);
    font-family:Georgia,serif;
    font-style:italic;
    font-size:0.92rem;
    line-height:1.55;
    color:var(--dim);
  }
  .artwork-placeholder{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    height:100%;
    width:100%;
    padding:20px;
    color:var(--dim2);
  }
  .artwork-placeholder .ring-pulse-art{
    width:52px; height:52px;
    border-radius:50%;
    border:1.5px solid var(--gold);
    margin-bottom:16px;
    position:relative;
    opacity:0.6;
  }
  .artwork-placeholder .ring-pulse-art::after{
    content:"";
    position:absolute; inset:-6px;
    border-radius:50%;
    border:1px solid var(--gold);
    opacity:0.4;
    animation:pulse-ring 2s ease-out infinite;
  }
  .artwork-placeholder .ap-text{
    font-family:'Orbitron',sans-serif;
    font-size:0.68rem;
    letter-spacing:2px;
    text-transform:uppercase;
    color:var(--dim2);
  }

  /* lyrics panel */
  .lyrics-col{
    flex:0 0 0px;
    opacity:0;
    overflow:hidden;
    transition:flex-basis 0.45s ease, opacity 0.3s ease;
  }
  .content-area.playing .lyrics-col{ flex:0 0 480px; opacity:1; }

  .lyrics-panel{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:10px;
    padding:26px 30px 30px;
    min-height:200px;
  }
  .lyrics-panel-head{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:16px;
    border-bottom:1px solid var(--border);
    padding-bottom:16px;
    margin-bottom:18px;
  }
  .lyrics-panel-title{
    font-family:'Orbitron',sans-serif;
    font-size:1.15rem;
    letter-spacing:0.5px;
    color:var(--text);
  }
  .lyrics-panel-tag{
    margin-top:6px;
    font-family:'Orbitron',sans-serif;
    font-size:0.65rem;
    letter-spacing:2px;
    text-transform:uppercase;
    color:var(--dim2);
  }
  .copy-btn{
    background:transparent;
    border:1px solid var(--gold);
    color:var(--gold);
    padding:6px 14px;
    border-radius:5px;
    font-family:'Orbitron',sans-serif;
    font-size:0.62rem;
    letter-spacing:1.5px;
    text-transform:uppercase;
    cursor:pointer;
    white-space:nowrap;
  }
  .copy-btn:hover{ background:rgba(201,162,75,0.1); }
  .copy-btn.copied{ color:#5ad1a3; border-color:#5ad1a3; }

  .lyrics-section{ margin-bottom:16px; font-family:Georgia,serif; }
  .lyrics-section .sec-label{
    font-family:'Orbitron',sans-serif;
    font-size:0.68rem;
    letter-spacing:2px;
    text-transform:uppercase;
    color:var(--gold);
    margin-bottom:6px;
  }
  .lyrics-section p{ margin:0 0 2px; font-size:1rem; color:var(--text); line-height:1.5; }

  .instrumental-placeholder{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:50px 20px;
    color:var(--dim);
  }
  .instrumental-placeholder .ring-pulse{
    width:64px; height:64px;
    border-radius:50%;
    border:1.5px solid var(--gold-dim, var(--gold));
    margin-bottom:18px;
    position:relative;
  }
  .instrumental-placeholder .ring-pulse::after{
    content:"";
    position:absolute; inset:-6px;
    border-radius:50%;
    border:1px solid var(--gold);
    opacity:0.4;
    animation:pulse-ring 2s ease-out infinite;
  }
  @keyframes pulse-ring{
    0%{ transform:scale(0.9); opacity:0.5; }
    100%{ transform:scale(1.35); opacity:0; }
  }
  .instrumental-placeholder .ip-title{
    font-family:'Orbitron',sans-serif;
    font-size:1.05rem;
    color:var(--text);
    font-style:italic;
    margin-bottom:6px;
  }
  .instrumental-placeholder .ip-note{
    font-family:'Orbitron',sans-serif;
    font-size:0.68rem;
    letter-spacing:2px;
    text-transform:uppercase;
    color:var(--dim2);
  }

  /* act accent application */
  #player[data-accent="actI"] .accent-bar{ background:var(--actI); }

function fmtTime(sec){
  if (!isFinite(sec) || sec == null) return '0:00';
  sec = Math.max(0, Math.floor(sec));
  const m = Math.floor(sec / 60);
  const s = sec % 60;
  return m + ':' + String(s).padStart(2,'0');
}

function renderTrack(song, actKey){
  const div = document.createElement('div');
  div.className = 'track' + (song.instrumental ? ' instrumental' : '');
  div.dataset.act = actKey;
  div.dataset.index = song.trackNum - 1;

  const tagHtml = song.instrumental
    ? `<div class="track-tag">${song.note || 'Instrumental'}</div>`
    : '';

  div.innerHTML = `
    <div class="track-row">
      <button class="track-playbtn glitch-hover" title="Play / Pause">
        <svg class="playicon" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
        <svg class="pauseicon" viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h4v14H6zm8 0h4v14h-4z"/></svg>
        <span class="eq"><span></span><span></span><span></span></span>
      </button>
      <div class="track-title-wrap">
        <div class="track-title"><span class="tnum">${String(song.trackNum).padStart(2,'0')}</span>${song.title}</div>
        ${tagHtml}
      </div>
    </div>`;

  div.querySelector('.track-playbtn').addEventListener('click', (e) => {
    e.stopPropagation();
    const idx = song.trackNum - 1;
    if (playingAct === actKey && playingIndex === idx){
      if (audioEl.paused) audioEl.play(); else audioEl.pause();
    } else {
      playTrack(actKey, idx);
    }
  });
  div.addEventListener('click', () => {
    viewTrack(actKey, song.trackNum - 1);
  });
  return div;
}

function renderLyricsPanel(song){
  if (!song){ lyricsPanel.innerHTML = ''; return; }

  if (song.instrumental){
    lyricsPanel.innerHTML = `
      <div class="instrumental-placeholder">
        <div class="ring-pulse"></div>
        <div class="ip-title">${song.title}</div>
        <div class="ip-note">${song.note || 'Instrumental'} · No Lyrics</div>
      </div>`;
    return;
  }

  const sectionsHtml = song.sections.map(s => `
    <div class="lyrics-section">
      <div class="sec-label">[${s.label}]</div>
      ${s.lines.map(l => `<p>${l}</p>`).join('')}
    </div>`).join('');
  const plain = song.sections.map(s => `[${s.label}]\n${s.lines.join('\n')}`).join('\n\n');

  lyricsPanel.innerHTML = `
    <div class="lyrics-panel-head">
      <div>
        <div class="lyrics-panel-title">${song.title}</div>
        <div class="lyrics-panel-tag">Lyrics</div>
      </div>
      <button class="copy-btn glitch-hover">Copy lyrics</button>
    </div>
    <div class="lyrics">${sectionsHtml}</div>`;

  lyricsPanel.querySelector('.copy-btn').addEventListener('click', (e) => {
    navigator.clipboard.writeText(plain).then(() => {
      const btn = e.currentTarget;
      const orig = btn.textContent;
      btn.textContent = 'Copied ✓';
      btn.classList.add('copied');
      setTimeout(() => { btn.textContent = orig; btn.classList.remove('copied'); }, 1400);
    });
  });
}

function renderArtworkPanel(song){
  if (!song){ artworkPanel.innerHTML = ''; return; }

  const caption = song.caption || '';
  const artSrc = song.art.split('/').map(encodeURIComponent).join('/');
  artworkPanel.innerHTML = `
    <div class="artwork-frame hud-frame" id="artworkFrame">
      <img src="${artSrc}" alt="${song.title}" id="artworkImg">
      <div class="scan-sweep"></div>
    </div>
    <div class="artwork-caption">${caption}</div>`;

  const img = document.getElementById('artworkImg');
  img.addEventListener('error', () => {
    const frame = document.getElementById('artworkFrame');
    if (frame){
      frame.innerHTML = `
        <div class="artwork-placeholder">
          <div class="ring-pulse-art"></div>
          <div class="ap-text">Artwork Coming Soon</div>
        </div>
        <div class="scan-sweep"></div>`;
    }
  }, { once: true });
}

function syncContentArea(){
  document.querySelectorAll('.track').forEach(t => {
    const isViewed = t.dataset.act === viewAct && parseInt(t.dataset.index) === viewIndex;
    t.classList.toggle('viewing', isViewed);
  });
  if (viewAct === currentAct && viewIndex > -1){
    contentArea.classList.add('playing');
    const song = DATA[viewAct].songs[viewIndex];
    renderLyricsPanel(song);
    renderArtworkPanel(song);
  } else {
    contentArea.classList.remove('playing');
    lyricsPanel.innerHTML = '';
    artworkPanel.innerHTML = '';
  }
  syncPanelNav();
}

function viewTrack(actKey, index){
  viewAct = actKey;
  viewIndex = index;
  syncContentArea();
}

function openAlbum(actKey){
  currentAct = actKey;
  const act = DATA[actKey];
  document.getElementById('playerCover').src = COVERS[actKey];
  document.getElementById('albumTitle').textContent = act.title;
  document.getElementById('albumSub').textContent = ALBUM_META[actKey].desc;
  const lyricCount = act.songs.filter(s => !s.instrumental).length;
  const instCount = act.songs.length - lyricCount;
  document.getElementById('albumMeta').innerHTML = `${lyricCount} Tracks · ${instCount} System Log${instCount===1?'':'s'}`;
  playerEl.setAttribute('data-accent', actKey);

  tracklistEl.innerHTML = '';
  act.songs.forEach(song => tracklistEl.appendChild(renderTrack(song, actKey)));
  refreshNowPlayingHighlight();
  syncContentArea();

  homeEl.style.display = 'none';
  playerEl.style.display = 'block';
  window.scrollTo(0,0);
}

document.querySelectorAll('.cover-card').forEach(card => {
  card.addEventListener('click', () => openAlbum(card.getAttribute('data-act')));
});
document.getElementById('backBtn').addEventListener('click', () => {
  playerEl.style.display = 'none';
  homeEl.style.display = 'flex';
  window.scrollTo(0,0);
});
document.getElementById('playAlbumBtn').addEventListener('click', () => {
  if (currentAct) playTrack(currentAct, 0);
});

const npStatus = document.getElementById('np-status');
const npPlayIcon = document.getElementById('np-play-icon');
const npSeek = document.getElementById('np-seek');
const npTime = document.getElementById('np-time');
const npDuration = document.getElementById('np-duration');
const nowplayingEl = document.getElementById('nowplaying');

function syncBarPadding(){
  if (document.body.classList.contains('has-player')){
    const navH = (panelNav && panelNav.style.display === 'flex') ? panelNav.offsetHeight : 0;
    document.body.style.paddingBottom = (nowplayingEl.offsetHeight + navH) + 'px';
  }
}
window.addEventListener('resize', syncBarPadding);
window.addEventListener('orientationchange', () => setTimeout(syncBarPadding, 150));

const npToggle = document.getElementById('npToggle');

function setCollapsed(collapsed){
  nowplayingEl.classList.toggle('collapsed', collapsed);
  syncBarPadding();
  syncPanelNav();
}

let npDragStartY = null;
let npDragMoved = false;

npToggle.addEventListener('pointerdown', (e) => {
  npDragStartY = e.clientY;
  npDragMoved = false;
  npToggle.setPointerCapture(e.pointerId);
});
npToggle.addEventListener('pointermove', (e) => {
  if (npDragStartY === null) return;
  if (Math.abs(e.clientY - npDragStartY) > 6) npDragMoved = true;
});
npToggle.addEventListener('pointerup', (e) => {
  if (npDragStartY === null) return;
  const deltaY = e.clientY - npDragStartY;
  const SWIPE_THRESHOLD = 12;
  if (Math.abs(deltaY) > SWIPE_THRESHOLD){
    setCollapsed(deltaY > 0); // swipe down -> collapse, swipe up -> expand
  } else {
    setCollapsed(!nowplayingEl.classList.contains('collapsed')); // plain tap toggles
  }
  npDragStartY = null;
});

// ---- mobile panel nav (tracks / artwork / lyrics swipe) ----
const panelNav = document.getElementById('panelNav');
const panelNavBtns = Array.from(panelNav.querySelectorAll('button'));
const MOBILE_BREAKPOINT = 900;

function isMobileLayout(){
  return window.innerWidth <= MOBILE_BREAKPOINT;
}

function getPanelCols(){
  return [
    contentArea.querySelector('.tracklist-col'),
    contentArea.querySelector('.artwork-col'),
    contentArea.querySelector('.lyrics-col'),
  ];
}

function syncPanelHeight(index){
  if (!isMobileLayout() || !contentArea.classList.contains('playing')) {
    contentArea.style.height = '';
    return;
  }
  const cols = getPanelCols();
  const active = cols[index];
  if (active){
    contentArea.style.height = active.scrollHeight + 'px';
  }
}

function currentPanelIndex(){
  return Math.round(contentArea.scrollLeft / Math.max(1, contentArea.clientWidth));
}

function syncPanelNav(){
  const show = isMobileLayout() && contentArea.classList.contains('playing');
  panelNav.style.display = show ? 'flex' : 'none';
  nowplayingEl.style.bottom = show ? panelNav.offsetHeight + 'px' : '0px';
  syncBarPadding();
  if (show){
    requestAnimationFrame(() => syncPanelHeight(currentPanelIndex()));
  } else {
    contentArea.style.height = '';
  }
}

function goToPanel(index){
  const width = contentArea.clientWidth;
  syncPanelHeight(index);
  contentArea.scrollTo({ left: index * width, behavior: 'smooth' });
  panelNavBtns.forEach((b, i) => b.classList.toggle('active', i === index));
}

panelNavBtns.forEach(btn => {
  btn.addEventListener('click', () => goToPanel(parseInt(btn.dataset.panel, 10)));
});

let panelScrollRAF = null;
contentArea.addEventListener('scroll', () => {
  if (!isMobileLayout() || !contentArea.classList.contains('playing')) return;
  if (panelScrollRAF) cancelAnimationFrame(panelScrollRAF);
  panelScrollRAF = requestAnimationFrame(() => {
    const idx = currentPanelIndex();
    panelNavBtns.forEach((b, i) => b.classList.toggle('active', i === idx));
    syncPanelHeight(idx);
  });
});

window.addEventListener('resize', syncPanelNav);

function playTrack(actKey, index){
  const act = DATA[actKey];
  const song = act.songs[index];
  if (!song) return;

  playingAct = actKey;
  playingIndex = index;
  viewAct = actKey;
  viewIndex = index;

  document.getElementById('np-cover').src = COVERS[actKey];
  document.getElementById('np-title').textContent = song.title;
  document.getElementById('np-album').textContent = act.title;
  document.body.classList.add('has-player');
  npStatus.textContent = '';
  npStatus.classList.remove('err');
  requestAnimationFrame(syncBarPadding);

  audioEl.src = song.file.split('/').map(encodeURIComponent).join('/');
  audioEl.play().then(() => {
    isPlaying = true;
    updatePlayIcon();
  }).catch(() => {});

  refreshNowPlayingHighlight();
  syncContentArea();
}

audioEl.addEventListener('error', () => {
  if (playingIndex === -1) return;
  npStatus.textContent = 'Audio file not found — add mp3s to match the tracklist filenames';
  npStatus.classList.add('err');
  isPlaying = false;
  updatePlayIcon();
});

audioEl.addEventListener('play', () => { isPlaying = true; updatePlayIcon(); });
audioEl.addEventListener('pause', () => { isPlaying = false; updatePlayIcon(); });
audioEl.addEventListener('ended', () => { nextTrack(); });
audioEl.addEventListener('loadedmetadata', () => {
  npSeek.max = audioEl.duration || 0;
  npDuration.textContent = fmtTime(audioEl.duration);
});
audioEl.addEventListener('timeupdate', () => {
  if (!isSeeking){
    npSeek.value = audioEl.currentTime;
    npTime.textContent = fmtTime(audioEl.currentTime);
  }
});

let isSeeking = false;
npSeek.addEventListener('input', () => { isSeeking = true; npTime.textContent = fmtTime(npSeek.value); });
npSeek.addEventListener('change', () => { audioEl.currentTime = npSeek.value; isSeeking = false; });

// ---- volume ----
const npMute = document.getElementById('np-mute');
const npVolIcon = document.getElementById('np-vol-icon');
const npVolSlider = document.getElementById('np-vol-slider');
let lastVolume = 1;

function loadStoredVolume(){
  try {
    const stored = localStorage.getItem('wondu-volume');
    return stored !== null ? parseFloat(stored) : 1;
  } catch (e) { return 1; }
}
function storeVolume(v){
  try { localStorage.setItem('wondu-volume', v); } catch (e) {}
}

function updateVolumeIcon(){
  const v = audioEl.volume;
  let path;
  if (v === 0 || audioEl.muted){
    path = '<path d="M16.5 12l3.5 3.5-1.5 1.5L15 13.5 11.5 17 10 15.5l3.5-3.5L10 8.5 11.5 7 15 10.5 18.5 7l1.5 1.5z"/><path d="M3 10v4h4l5 5V5L7 10H3z"/>';
  } else if (v < 0.5){
    path = '<path d="M3 10v4h4l5 5V5L7 10H3z"/><path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/>';
  } else {
    path = '<path d="M3 10v4h4l5 5V5L7 10H3z"/><path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/><path d="M14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>';
  }
  npVolIcon.innerHTML = path;
  npVolSlider.value = audioEl.muted ? 0 : v;
}

const initialVolume = loadStoredVolume();
audioEl.volume = initialVolume;
npVolSlider.value = initialVolume;
lastVolume = initialVolume || 1;
updateVolumeIcon();

npVolSlider.addEventListener('input', () => {
  const v = parseFloat(npVolSlider.value);
  audioEl.muted = false;
  audioEl.volume = v;
  if (v > 0) lastVolume = v;
  storeVolume(v);
  updateVolumeIcon();
});

npMute.addEventListener('click', () => {
  if (audioEl.muted || audioEl.volume === 0){
    audioEl.muted = false;
    audioEl.volume = lastVolume || 1;
    storeVolume(audioEl.volume);
  } else {
    lastVolume = audioEl.volume;
    audioEl.muted = true;
  }
  updateVolumeIcon();
});

function updatePlayIcon(){
  npPlayIcon.innerHTML = isPlaying
    ? '<path d="M6 5h4v14H6zm8 0h4v14h-4z"/>'
    : '<path d="M8 5v14l11-7z"/>';
  refreshNowPlayingHighlight();
}

function refreshNowPlayingHighlight(){
  document.querySelectorAll('.track').forEach(t => {
    const isThis = t.dataset.act === playingAct && parseInt(t.dataset.index) === playingIndex;
    t.classList.toggle('current', isThis);
    t.classList.toggle('now-playing', isThis && isPlaying);
  });
}

document.getElementById('np-play').addEventListener('click', () => {
  if (playingIndex === -1) return;
  if (audioEl.paused) audioEl.play(); else audioEl.pause();
});
document.getElementById('np-next').addEventListener('click', nextTrack);
document.getElementById('np-prev').addEventListener('click', prevTrack);

function nextTrack(){
  if (!playingAct) return;
  const songs = DATA[playingAct].songs;
  if (playingIndex < songs.length - 1){
    playTrack(playingAct, playingIndex + 1);
  } else {
    isPlaying = false;
    updatePlayIcon();
  }
}
function prevTrack(){
  if (!playingAct) return;
  if (audioEl.currentTime > 3){
    audioEl.currentTime = 0;
    return;
  }
  if (playingIndex > 0){
    playTrack(playingAct, playingIndex - 1);
  }
}
</script>

</body>
</html>
